[project]
name = "data-agent-bench"
version = "0.1.0"
description = "A tool-using data analyst agent and a verifiable benchmark for multi-step data analysis with LLMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "numpy>=1.26",
    "openai>=1.40",
    "pandas>=2.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
dab = "data_agent_bench.cli:main"
dab-mcp = "data_agent_bench.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
